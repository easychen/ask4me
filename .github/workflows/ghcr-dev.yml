name: ghcr-dev

on:
  push:
    branches:
      - feat/e2ee
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (standard image uses <tag>, slim uses <tag>-slim)"
        required: true
        default: "feat-e2ee"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.inputs.tag || 'feat-e2ee' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standard image
        id: standard
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push slim image
        id: slim
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}-slim
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test standard image (amd64)
        run: |
          set -euo pipefail
          name=ask4me-smoke
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --platform linux/amd64 \
            -e ASK4ME_BASE_URL=http://127.0.0.1:18080 \
            -e ASK4ME_API_KEY=smoke-key \
            -e ASK4ME_SQLITE_PATH=/data/smoke.db \
            -e ASK4ME_LISTEN_ADDR=:8080 \
            -p 18080:8080 \
            "ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}"
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/v1/ask || true)
            if [ "$code" = "401" ]; then break; fi
            sleep 1
          done
          docker logs "$name"
          test "$code" = "401"

      - name: Smoke test slim image (amd64)
        run: |
          set -euo pipefail
          name=ask4me-slim-smoke
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --platform linux/amd64 \
            -e ASK4ME_BASE_URL=http://127.0.0.1:18081 \
            -e ASK4ME_API_KEY=smoke-key \
            -e ASK4ME_SQLITE_PATH=/data/smoke.db \
            -e ASK4ME_LISTEN_ADDR=:8080 \
            -p 18081:8080 \
            "ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}-slim"
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/v1/ask || true)
            if [ "$code" = "401" ]; then break; fi
            sleep 1
          done
          docker logs "$name"
          test "$code" = "401"

      - name: Summary
        run: |
          {
            echo "### GHCR images"
            echo ""
            echo "- standard: \`ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}\`"
            echo "  - digest: \`${{ steps.standard.outputs.digest }}\`"
            echo "- slim: \`ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}-slim\`"
            echo "  - digest: \`${{ steps.slim.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
