name: ghcr-dev

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag suffix (standard image uses <tag>, slim uses <tag>-slim)"
        required: true
        default: "feat-e2ee"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standard image
        id: standard
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push slim image
        id: slim
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}-slim
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### GHCR images"
            echo ""
            echo "- standard: \`ghcr.io/${{ github.repository }}:${{ inputs.tag }}\`"
            echo "  - digest: \`${{ steps.standard.outputs.digest }}\`"
            echo "- slim: \`ghcr.io/${{ github.repository }}:${{ inputs.tag }}-slim\`"
            echo "  - digest: \`${{ steps.slim.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
